name: Build updated documentation dependency offline from source
on:
  push:
    branches: [fix/514-docs-api-build]
permissions:
  contents: read
jobs:
  api-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f13467a941c572972ed44f11e7e160ef4d3f8068
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run the deterministic API reference build
        timeout-minutes: 10
        env:
          PYTHONPATH: src
        run: |
          mkdir -p docs-build-evidence
          git rev-parse HEAD > docs-build-evidence/source.sha
          test "$(cat docs-build-evidence/source.sha)" = f13467a941c572972ed44f11e7e160ef4d3f8068
          python -m pip install --disable-pip-version-check uv==0.11.33
          python tools/build_api_reference.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("_build/docs/api-build.json")
          value = json.loads(report.read_text(encoding="utf-8"))
          if set(value.get("locales", {})) != {"en", "ru", "zh-cn"}:
              raise ValueError("API build report must cover all configured locales")
          if value.get("reproducible") is not True or value.get("sourceUnchanged") is not True:
              raise ValueError("API build must prove reproducibility and unchanged sources")
          Path("docs-build-evidence/api-build.json").write_bytes(report.read_bytes())
          PY
      - name: Retain exact source and reproducibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-only-api-build
          path: docs-build-evidence/
          if-no-files-found: warn
          retention-days: 7
