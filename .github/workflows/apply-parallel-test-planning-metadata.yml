name: Apply parallel test planning metadata

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  issues: write

jobs:
  apply:
    name: Apply and verify native issue metadata
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Apply native types, fields and hierarchy
        shell: bash
        run: |
          set -euo pipefail

          Rest() {
            curl --fail-with-body --silent --show-error \
              --request "$1" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --header "Content-Type: application/json" \
              "$2" "${@:3}"
          }

          Graphql() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$1" \
              https://api.github.com/graphql
          }

          type_query='query { organization(login: "Fuzzy-Technologies") { issueTypes(first: 20) { nodes { id name } } } }'
          types="$(Graphql "$(jq -nc --arg query "$type_query" '{query: $query}')")"
          feature_type="$(jq -er '.data.organization.issueTypes.nodes[] | select(.name == "Feature") | .id' <<<"$types")"
          task_type="$(jq -er '.data.organization.issueTypes.nodes[] | select(.name == "Task") | .id' <<<"$types")"

          mutation='mutation($id: ID!, $issueTypeId: ID) { updateIssue(input: {id: $id, issueTypeId: $issueTypeId}) { issue { number issueType { name } } } }'
          SetType() {
            Graphql "$(jq -nc --arg query "$mutation" --arg id "$1" --arg issue_type "$2" \
              '{query: $query, variables: {id: $id, issueTypeId: $issue_type}}')" |
              jq -e '.data.updateIssue.issue.issueType.name'
          }

          SetType "I_kwDOUQhAas8AAAABRkt0Cg" "$feature_type" >/dev/null
          SetType "I_kwDOUQhAas8AAAABRkt8ow" "$task_type" >/dev/null
          SetType "I_kwDOUQhAas8AAAABRkt83w" "$task_type" >/dev/null
          SetType "I_kwDOUQhAas8AAAABRkt-RA" "$task_type" >/dev/null

          for child_id in 5474319523 5474319743 5474319940; do
            Rest POST "https://api.github.com/repos/$GH_REPO/issues/183/sub_issues" \
              --data "{\"sub_issue_id\":$child_id,\"replace_parent\":true}" >/dev/null
          done

          for issue in 183 184 185 186; do
            Rest POST "https://api.github.com/repos/$GH_REPO/issues/$issue/issue-field-values" \
              --data '{"issue_field_values":[{"field_id":22639629,"value":"High"},{"field_id":22639632,"value":"Medium"}]}' >/dev/null
          done

          for issue in 183 184 185 186; do
            Rest GET "https://api.github.com/repos/$GH_REPO/issues/$issue" |
              jq -e '{number, type: .type.name, milestone: .milestone.number, assignees: [.assignees[].login], labels: [.labels[].name], parent_issue_url, issue_field_values}'
          done
