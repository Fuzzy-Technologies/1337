name: Offline retained reporting pytest

on:
  push:
    branches: [fix/64-offline-report-pytest]

permissions:
  contents: read

jobs:
  comparison:
    name: Selected offline retained reporting tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact Draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e168d91fd3895c0afdc45b231cf5877e9e85811c
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned uv and locked test dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev --no-install-project
      - name: Run selected saved-data tests with sockets and child processes blocked
        timeout-minutes: 2
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          mkdir -p .offline-reporting-evidence
          git rev-parse HEAD > .offline-reporting-evidence/source.sha
          test "$(cat .offline-reporting-evidence/source.sha)" = e168d91fd3895c0afdc45b231cf5877e9e85811c
          .venv/bin/python - <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree

          def RefuseExternalEffects(event, args):
              if event.startswith("socket.") or event.startswith("subprocess.") or event in {
                  "os.exec", "os.fork", "os.forkpty", "os.posix_spawn", "os.spawn", "os.system", "os.startfile",
              }:
                  raise RuntimeError(f"Offline pytest blocked {event}")

          sys.addaudithook(RefuseExternalEffects)
          import pytest

          report = ".offline-reporting-evidence/results.xml"
          result = pytest.main([
              "-p", "pytest_cov.plugin", "-p", "xdist.plugin", "-n", "0",
              "--strict-config", "--strict-markers",
              "-o", "addopts=", "--no-cov", "-q",
              "tests/unit/test_reporting.py::test_RetainedReportRowsIndexEveryObservationOnceAndPreserveItsOwner",
              "tests/contract/test_reporting_contract.py::test_GoldenArtifactsPinExactVersionOneOutput",
              f"--junitxml={report}",
          ])
          if result != pytest.ExitCode.OK:
              sys.exit(result)
          root = ElementTree.parse(report).getroot()
          cases = list(root.iter("testcase"))
          if len(cases) != 5 or any(
              case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")
          ):
              sys.exit("All five selected cases must complete successfully.")
          PY
      - name: Preserve exact source and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-retained-reporting-pytest
          path: .offline-reporting-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
