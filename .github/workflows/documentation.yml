name: Documentation

on:
  pull_request:
    branches: [develop, master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-documentation:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned tooling and the hashed documentation lock
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev
          uv pip install --python .venv/bin/python --require-hashes -r docs/requirements-api.lock
      - name: Check Markdown table alignment
        run: .venv/bin/python tools/markdown_tables.py
      - name: Validate publication authority and source contracts
        run: |
          .venv/bin/python tools/documentation_publication_policy.py .github/workflows/documentation.yml
          .venv/bin/python tools/source_documentation_audit.py --check
          .venv/bin/python tools/locale_documentation.py validate --output _build/docs/locales.json
      - name: Exercise documentation boundaries and enforce per-tool branch coverage
        run: |
          release_tests=()
          for tool in release_delivery release_finalize release_recovery; do
            if test -f "tools/$tool.py"; then
              test -f "tests/unit/test_$tool.py"
              release_tests+=("tests/unit/test_$tool.py")
            fi
          done
          .venv/bin/python -m pytest -q -n auto --dist=loadscope -o addopts='' \
            tests/unit/test_api_reference.py tests/unit/test_locale_documentation.py \
            tests/unit/test_compose_documentation.py tests/unit/test_source_documentation_audit.py \
            tests/unit/test_product_site_preparation.py tests/unit/test_documentation_publication_policy.py \
            tests/unit/test_documentation_render.py tests/unit/test_markdown_tables.py \
            tests/unit/test_feature_completion.py tests/unit/test_pytest_progress_bootstrap.py \
            "${release_tests[@]}" --cov=tools --cov-branch --cov-config=/dev/null \
            --cov-report=term-missing --cov-report=json:_build/docs/tool-coverage.json
          .venv/bin/python -m fuzzy1337.coverage_gate _build/docs/tool-coverage.json tools
      - name: Download the fixed original API custody bundle for recovery PR388
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.number == 388
          && github.event.pull_request.head.ref == 'fix/release-publication-recovery'
          && github.event.pull_request.head.repo.full_name == 'Fuzzy-Technologies/1337'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "12931865374"
          run-id: "40950150194"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/documentation-original-release
          digest-mismatch: error
      - name: Select the finite 0.3 API publication source
        id: api-mode
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_DOCUMENTATION: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 388 && github.event.pull_request.head.ref == 'fix/release-publication-recovery' && github.event.pull_request.head.repo.full_name == 'Fuzzy-Technologies/1337' }}
          RECOVERY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "$RECOVERY_DOCUMENTATION" = true; then
            .venv/bin/python -c 'import json,os; from pathlib import Path; from tools.release_recovery import DocumentationSelection; print(json.dumps(DocumentationSelection(Path(os.environ["RUNNER_TEMP"])/"documentation-original-release",os.environ["RECOVERY_HEAD"]),sort_keys=True))' \
              > _build/docs/api-selection.json
          else
            .venv/bin/python tools/compose_documentation.py --select-version-source . \
              > _build/docs/api-selection.json
          fi
          .venv/bin/python -c 'import json,os; value=json.load(open("_build/docs/api-selection.json")); assert set(value)=={"release_version","retained_archive","retained_sha256"}; stream=open(os.environ["GITHUB_OUTPUT"],"a"); stream.write("".join(key+"="+value[key]+"\n" for key in ("release_version","retained_archive","retained_sha256")))'
      - name: Build a reproducible static reference from a clean installed wheel
        env:
          RELEASE_VERSION: ${{ steps.api-mode.outputs.release_version }}
        run: |
          version_args=()
          if test -n "$RELEASE_VERSION"; then
            version_args+=(--release-version "$RELEASE_VERSION")
          fi
          .venv/bin/python tools/build_api_reference.py "${version_args[@]}"
          if test -n "$RELEASE_VERSION"; then
            .venv/bin/python tools/compose_documentation.py \
              --verify-version-archive "_build/docs/1337-$RELEASE_VERSION-api-docs.tar.gz" \
              --archive-manifest "_build/docs/1337-$RELEASE_VERSION-api-docs.manifest.json" \
              --expected-revision "$GITHUB_SHA" --expected-tree "$(git rev-parse 'HEAD^{tree}')" \
              --expected-version "$RELEASE_VERSION" --expected-epoch "$(git show -s --format=%ct HEAD)"
          fi
      - name: Prove real offline formula rendering
        # Browser proof is publication-only; development gates are deterministic code/tests.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: .venv/bin/python tools/verify_documentation_render.py
      - name: Stage only reviewed product site sources
        run: .venv/bin/python tools/prepare_product_site.py --output _build/product-source
      - name: Build the retained Jekyll product site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: _build/product-source
          destination: _build/product-site
      - name: Compose and verify the single Pages artifact
        env:
          RELEASE_VERSION: ${{ steps.api-mode.outputs.release_version }}
          RETAINED_ARCHIVE: ${{ steps.api-mode.outputs.retained_archive }}
          RETAINED_SHA256: ${{ steps.api-mode.outputs.retained_sha256 }}
        run: |
          mkdir -p _build/pages
          version_args=()
          if test -n "$RELEASE_VERSION"; then
            version_args+=(--version-root "_build/api-versions/$RELEASE_VERSION")
          fi
          if test -n "$RETAINED_ARCHIVE"; then
            version_args+=(--retained-api-archive "$RETAINED_ARCHIVE" --retained-api-sha256 "$RETAINED_SHA256")
          fi
          .venv/bin/python tools/compose_documentation.py \
            --product-site _build/product-site --api-root _build/api-reference \
            --output _build/pages/site --base-path /1337 --revision "${GITHUB_SHA}" "${version_args[@]}"
      - name: Retain exact master-render transfer bytes for release delivery
        if: steps.api-mode.outputs.release_version == '0.3.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _build/docs/1337-0.3.0-api-docs.tar.gz
            _build/docs/1337-0.3.0-api-docs.manifest.json
          if-no-files-found: error
      - name: Preserve reproducible gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-evidence-${{ github.sha }}
          path: |
            _build/docs/*.json
            _build/pages/site/documentation-provenance.json
            .tmp/source-documentation-audit
          if-no-files-found: warn
      - name: Upload the validated official Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/pages/site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.ref_protected
    needs: deterministic-documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
