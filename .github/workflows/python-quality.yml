name: Python quality

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.12"
          - os: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Run repository quality gate
        run: uv run --locked --extra dev 1337-dev check
      - name: Preserve test and package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-${{ matrix.os }}
          path: |
            coverage/
            dist/
          if-no-files-found: ignore
          retention-days: 14
