name: Python quality

on:
  pull_request:
    branches: [develop, master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false) || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[native-image-protocol-checkpoint]'))
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[owned-response-protocol-checkpoint]'))
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.12"
            suite_timeout_seconds: 900
            job_timeout_minutes: 20
          - os: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check owned transport lifecycle on Windows
        if: >-
          matrix.os == 'windows-2022' && (github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
        run: >-
          uv run --locked --extra dev pytest
          tests/integration/test_proxy_regression_workflow.py
          tests/integration/test_web_vulnerability_target.py
          -o addopts='' -q
          -k 'IndependentVerifyingClientRejectsTheActualSelfSignedCertificate or PartialHeader'
      - name: Run focused native image protocol checks
        timeout-minutes: 5
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[native-image-protocol-checkpoint]')
        run: >-
          uv run --locked --extra dev pytest -q -x --max-worker-restart=0
          --timeout=30 --timeout-method=thread -n 2 --dist=loadscope -o addopts='' --no-cov
          tests/unit/test_native_image_material_worker.py
          tests/unit/test_native_image_observation.py
          tests/unit/test_native_image_bounded_capture.py
          tests/unit/test_native_image_control_identity.py
          tests/unit/test_native_image_policy.py
          tests/unit/test_native_image_policy_oracle.py
          tests/unit/test_native_image_workflow.py
          tests/contract/test_native_image_cli.py
          --junitxml=functional-evidence/native-image-protocol.xml
      - name: Run focused owned response protocol checks
        timeout-minutes: 5
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[owned-response-protocol-checkpoint]')
        run: >-
          uv run --locked --extra dev pytest -q -x --max-worker-restart=0
          --timeout=30 --timeout-method=thread -n 2 --dist=loadscope -o addopts='' --no-cov
          tests/unit/test_owned_response_capture.py
          tests/unit/test_owned_response_capture_worker.py
          tests/unit/test_owned_response_parent.py
          tests/unit/test_owned_response_workflow.py
          tests/unit/test_response_commands.py
          tests/unit/test_native_image_workflow.py
          tests/integration/test_owned_response_worker_execution.py
          --junitxml=functional-evidence/owned-response-protocol.xml
      - name: Run repository quality gate
        if: >-
          github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false)
        env:
          FUZZY1337_RUN_DESCENDANT_ACCEPTANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
          FUZZY1337_RUN_OWNED_RESPONSE_PRODUCT_ACCEPTANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: >-
          uv run --locked --extra dev 1337-dev check --fail-fast
          --suite-timeout ${{ matrix.suite_timeout_seconds || 600 }}
      - name: Preserve test and package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-${{ matrix.os }}
          path: |
            coverage/
            dist/
            functional-evidence/
            performance/
          if-no-files-found: ignore
          retention-days: 14

  owned-traversal-rate-checkpoint:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[owned-traversal-rate-checkpoint]')
    name: Owned traversal Windows rate feature checks
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Run pure rate deadline and timeout classification regressions
        timeout-minutes: 2
        run: >-
          uv run --locked --extra dev pytest -q -x
          'tests/unit/test_web_traversal.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[complete]'
          'tests/unit/test_web_traversal.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[cancel]'
          'tests/unit/test_web_traversal.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[budget]'
          'tests/unit/test_native_crawl.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[complete]'
          'tests/unit/test_native_crawl.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[cancel]'
          'tests/unit/test_native_crawl.py::test_RateGateRechecksOriginalDeadlineAfterEarlyWake[budget]'
          tests/unit/test_test_runner.py::test_IncidentalTimeoutTextCannotRelabelAnOrdinaryJunitFailure
          tests/unit/test_test_runner.py::test_PinnedPytestTimeoutFailureMessagesRetainCallAndFixtureExpiry
          -n 2 --dist=loadscope --max-worker-restart=0 -o addopts='' --no-cov
          --timeout=30 --timeout-method=thread
          --junitxml=functional-evidence/owned-traversal-rate/windows-pure.xml
      - name: Run the two affected genuine traversal cases
        timeout-minutes: 4
        run: >-
          uv run --locked --extra dev pytest -q -x
          tests/integration/test_web_traversal_execution.py::test_ActualAsyncTraversalPreservesOrderedCommitsAndIndependentOracle
          tests/functional/test_native_crawl_product.py::test_ActualSdkChangesFetchesAtSameSeedAndPreservesOrderedOriginalState
          -n 0 -o addopts='' --no-cov --timeout=90 --timeout-method=thread
          --junitxml=functional-evidence/owned-traversal-rate/windows-genuine.xml
      - name: Preserve focused traversal rate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-traversal-windows-rate-feature
          path: |
            functional-evidence/owned-traversal-rate/
            functional-evidence/native-crawl/
          retention-days: 7
          if-no-files-found: warn

  native-crawl-windows-portability:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[native-crawl-portability-checkpoint]')
    name: Native crawl Windows feature checks
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Run focused Windows crawl units
        timeout-minutes: 3
        run: >-
          uv run --locked --extra dev pytest -q -x
          tests/unit/test_native_crawl_workflow.py tests/unit/test_native_crawl_commands.py
          -n 2 --dist=loadscope --max-worker-restart=0 -o addopts='' --no-cov
          --timeout=30 --timeout-method=thread
          --junitxml=functional-evidence/native-crawl-portability/windows-unit.xml
      - name: Run one genuine Windows crawl cancellation case
        timeout-minutes: 2
        run: >-
          uv run --locked --extra dev pytest -q -x
          tests/functional/test_native_crawl_product.py::test_ActualSdkCallerCancellationSettlesOriginalWorkerAndSocket
          -n 0 -o addopts='' --no-cov --timeout=60 --timeout-method=thread
          --junitxml=functional-evidence/native-crawl-portability/windows-cancellation.xml
      - name: Preserve focused Windows crawl evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crawl-windows-feature
          path: |
            functional-evidence/native-crawl-portability/
            functional-evidence/native-crawl/
          retention-days: 7
          if-no-files-found: warn

  native-crawl-container-portability:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[native-crawl-portability-checkpoint]')
    name: Native crawl container feature check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build existing development image
        timeout-minutes: 6
        run: docker compose --profile quality build quality
      - name: Run one genuine crawl worker through quality override
        timeout-minutes: 2
        run: >-
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose --profile quality run --rm quality pytest -q -x
          'tests/integration/test_native_crawl_worker_execution.py::test_InstalledWorkerBindsActualGetBodyAndHandwrittenFrontier[positive-/entry]'
          -n 0 -o addopts='' --no-cov --timeout=60 --timeout-method=thread
          --junitxml=functional-evidence/native-crawl-portability/container-worker.xml
      - name: Preserve focused container crawl evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crawl-container-feature
          path: |
            functional-evidence/native-crawl-portability/
            functional-evidence/native-crawl/
          retention-days: 7
          if-no-files-found: warn

  browser-page-quality:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false) || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[browser-feature-checkpoint]'))
    name: Offline browser page acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize the explicit browser extra
        run: uv sync --locked --extra dev --extra browser
      - name: Install the pinned Chromium headless shell
        run: >-
          uv run --locked --extra dev --extra browser
          python -m playwright install chromium --only-shell
      - name: Verify real browser descendant cancellation and timeout
        env:
          FUZZY1337_RUN_PLAYWRIGHT_ACCEPTANCE: "1"
        run: >-
          uv run --locked --extra dev --extra browser pytest
          tests/integration/test_browser_page_execution.py
          --no-cov -n 2 --dist=load -q -m 'not serial'
          --junitxml=functional-evidence/browser-owner.xml
      - name: Verify real offline DOM and original source custody
        env:
          FUZZY1337_RUN_PLAYWRIGHT_ACCEPTANCE: "1"
        run: >-
          uv run --locked --extra dev --extra browser pytest
          tests/integration/test_browser_page_execution.py
          --no-cov -n 0 -q -m serial
          --junitxml=functional-evidence/browser-dom.xml
      - name: Preserve genuine browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-page-acceptance
          path: functional-evidence/browser-*
          if-no-files-found: ignore
          retention-days: 14

  container-quality:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false)
    name: Container configuration and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build locked development image
        run: docker compose build
      - name: Run container quality gate
        run: >-
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose --profile quality run --rm quality 1337-dev check --fail-fast
          --suite-timeout 900

  synthetic-lab:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false)
    name: Synthetic lab lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start isolated safe target
        run: docker compose --profile lab up --build --wait lab-web-safe
      - name: Verify safe target contract
        run: >-
          docker compose exec -T lab-web-safe python -c
          "from urllib.request import urlopen; import json; response = urlopen('http://127.0.0.1:8080/health', timeout=1); assert json.load(response) == {'status': 'ok', 'target': 'web-safe'}"
      - name: Start attack-path mini lab
        run: >-
          docker compose --profile attack-path up --build --wait
          lab-attack-portal lab-attack-identity lab-attack-events
          lab-attack-billing lab-attack-client
      - name: Verify attack-path mini lifecycle
        run: |
          docker compose exec -T lab-attack-client python client.py reset
          docker compose exec -T lab-attack-client python client.py validate
          docker compose exec -T lab-attack-client python client.py negative
          docker compose exec -T lab-attack-client python client.py remediate
          docker compose exec -T lab-attack-client python client.py reset
      - name: Stop synthetic lab
        if: always()
        run: docker compose --profile lab --profile attack-path down --volumes --remove-orphans

  external-targets:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false)
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[native-external-checkpoint]'))
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]'))
    name: Pinned external target regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FUZZY1337_EXTERNAL_TARGETS: juice-shop
      FUZZY1337_EXTERNAL_NATIVE_BENCHMARK: juice-shop
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Execute pinned target through pytest
        if: >-
          !(github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]')) && (github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false))
        run: >-
          uv run --locked --extra dev pytest tests/functional/test_external_targets.py
          -o addopts='' --no-cov -n 0 -v
      - name: Execute installed native scanner against three fresh pinned targets
        if: >-
          !(github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]')) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false
          || !contains(github.event.pull_request.body, '[native-external-metrics-diagnostic]'))
        timeout-minutes: 15
        run: >-
          uv run --locked --extra dev pytest tests/functional/test_external_native_benchmark.py
          -o addopts='' --no-cov -n 0 -v
          --junitxml=functional-evidence/external-native-benchmark/pytest.xml
      - name: Capture one separate fresh-target metrics diagnostic
        if: >-
          !(github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]')) && (github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[native-external-metrics-diagnostic]'))
        timeout-minutes: 3
        env:
          FUZZY1337_EXTERNAL_METRICS_DIAGNOSTIC: juice-shop
        run: >-
          uv run --locked --extra dev pytest tests/functional/test_external_metrics_diagnostic.py
          -o addopts='' --no-cov -n 0 -v
          --junitxml=functional-evidence/external-native-benchmark/diagnostic/pytest.xml
      - name: Execute one target-free installed Nuclei prerequisite
        if: >-
          github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false)
          || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]'))
        timeout-minutes: 17
        env:
          FUZZY1337_EXTERNAL_NUCLEI_PREREQUISITES: linux-amd64
        run: >-
          uv run --locked --extra dev pytest
          tests/functional/test_external_nuclei_prerequisites.py::test_InstalledImageRunsOfflineExactNucleiPrerequisites
          -o addopts='' --no-cov -n0 -v --timeout=600 --timeout-method=signal
          --junitxml=functional-evidence/nuclei-prerequisites.xml
      - name: Require original target-free Nuclei prerequisite evidence
        if: >-
          github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false)
          || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[nuclei-prerequisite-checkpoint]'))
        timeout-minutes: 1
        env:
          NUCLEI_PREREQUISITE_SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          source_identity="$(git rev-parse HEAD HEAD^{tree})"
          python - "$NUCLEI_PREREQUISITE_SOURCE_HEAD" "$source_identity" <<'PY'
          # SPDX-FileCopyrightText: 2026 Timur Gilmullin and Fuzzy Technologies
          # SPDX-License-Identifier: Apache-2.0

          """Read original prerequisite-only receipts; the host owns deep admission and Docker cleanup."""

          import json
          import re
          import sys
          from pathlib import Path
          from xml.etree import ElementTree


          def Require(condition: bool, message: str) -> None:
              """Refuse missing original proof without launching or repairing anything.

              Args:
                  condition: Exact predicate over retained original facts.
                  message: Fixed scope-specific failure diagnostic.

              Raises:
                  SystemExit: The required original fact is absent or differs.
              """

              if not condition:
                  raise SystemExit(message)


          def Read(path: Path, maximum: int = 2 * 1024 * 1024) -> bytes:
              """Read one bounded original file without accepting a symbolic alias.

              Args:
                  path: Fixed file beneath the original prerequisite evidence owner.
                  maximum: Inclusive byte ceiling for this one original record.

              Returns:
                  Complete original bytes, including an empty recorded stderr stream.

              Raises:
                  SystemExit: The file is aliased, not regular or oversized.
                  OSError: The original file is absent or cannot be read.
              """

              Require(not path.is_symlink() and path.is_file() and path.stat().st_size <= maximum,
                  "Missing, aliased or oversized prerequisite original")
              raw = path.read_bytes()
              Require(len(raw) <= maximum, "Prerequisite original grew beyond its bound")

              return raw


          def Json(path: Path) -> object:
              """Decode one original JSON document without importing the host or image helper.

              Args:
                  path: Fixed retained metadata path.

              Returns:
                  Parsed original document; no absent values are synthesized.
              """

              return json.loads(Read(path))


          expected = sys.argv[1]
          identity = sys.argv[2].splitlines()
          Require(len(identity) == 2 and expected == identity[0] and all(
              re.fullmatch('[a-f0-9]{40}', value) for value in identity),
              'Prerequisite source must be the exact checked-out PR head and tree')
          junit = ElementTree.fromstring(Read(Path('functional-evidence/nuclei-prerequisites.xml')))
          suites, cases = list(junit.iter('testsuite')), list(junit.iter('testcase'))
          Require(len(suites) == len(cases) == 1 and all(suites[0].get(key) == value for key, value in (
              ('tests', '1'), ('failures', '0'), ('errors', '0'), ('skipped', '0'))) and (
              cases[0].get('classname') == 'tests.functional.test_external_nuclei_prerequisites'
              and cases[0].get('name') == 'test_InstalledImageRunsOfflineExactNucleiPrerequisites'
              and not any(list(junit.iter(kind)) for kind in ('failure', 'error', 'skipped'))),
              'Require exactly one original prerequisite pass without skip/error/failure')
          runs = list(Path('functional-evidence/external-nuclei-prerequisites').glob('run-*'))
          Require(len(runs) == 1 and re.fullmatch('run-[a-f0-9]{12}', runs[0].name) is not None
              and runs[0].is_dir() and not runs[0].is_symlink(),
              'Require one fresh prerequisite evidence owner; stale or multiple runs refuse')
          root = runs[0]
          host = Json(root / 'host.json')
          Require(host['status'] == 'completed-prerequisites' and host['source_revision'] == expected
              and host['source_tree'] == identity[1] and host['configured_target_inputs'] == []
              and host['governed_no_home_compatibility'] == 'not-established'
              and not any(key in host for key in ('failure', 'cleanup_failure',
                  'caller_cancellations_during_cleanup')),
              'Original completed host/source receipt or target-free scope differs')
          for field in ('image_id', 'container_id'):
              Require(re.fullmatch('sha256:[a-f0-9]{64}' if field == 'image_id' else '[a-f0-9]{64}',
                  host[field]) is not None, 'Host must retain actual immutable image/container IDs')

          base_id = Read(root / 'base.iid', 80).decode('ascii').strip()
          Require(re.fullmatch('sha256:[a-f0-9]{64}', base_id) is not None and base_id != host['image_id']
              and Read(root / 'runner.iid', 80).decode('ascii').strip() == host['image_id'],
              'Original base/runner image IDs must reconcile')
          cleanup = host['cleanup']
          Require(len(cleanup) == 3 and cleanup[0] == {'container_absent': True}
              and all(set(row) == {'tag', 'absent'} and row['absent'] is True for row in cleanup[1:]),
              'Completed host requires independent container and both image-tag absence receipts')
          owner = cleanup[1]['tag'].removeprefix('fuzzy1337-nuclei-runner-')
          Require(re.fullmatch('[a-f0-9]{32}', owner) is not None and root.name == 'run-' + owner[:12]
              and cleanup[1]['tag'] == 'fuzzy1337-nuclei-runner-' + owner
              and cleanup[2]['tag'] == 'fuzzy1337-nuclei-base-' + owner,
              'Cleanup receipts must belong to the one original run')
          context = Json(root / 'context-inventory.json')
          Require(context['revision'] == expected and context['tree'] == identity[1],
              'Original committed context must bind the selected source/tree')
          imported = root / 'imported'
          Require(Json(imported / 'prerequisites.json') == {
              'status': 'completed-prerequisites', 'version_probe': 'completed',
              'go_template_validation': 'completed', 'governed_no_home_compatibility': 'not-established',
              'configured_target_inputs': [], 'independent_server_contact_count': None}
              and not (imported / 'failure.json').exists(),
              'Imported result must retain target-free prerequisite-only uncertainty')
          manifest = Json(imported / 'image-provisioning.json')
          Require(manifest['source_revision'] == expected and manifest['installed']['installed'][
              'source_revision'] == expected, 'Imported installed source must match the actual PR head')
          ARGUMENTS = {'version': ['/opt/benchmark-material/nuclei', '-version', '-duc'],
              'validate': ['/opt/benchmark-material/nuclei', '-validate', '-t',
                  '/opt/benchmark-material/prometheus-exposition.yaml', '-config',
                  '/opt/benchmark-material/operator-config.yaml', '-duc', '-ni', '-no-stdin',
                  '-pt', 'http', '-nc']}
          for name, argv in ARGUMENTS.items():
              stage = imported / name
              invocation, process = Json(stage / 'invocation.json'), Json(stage / 'process.json')
              Require(invocation['argv'] == argv and invocation['basis'] == (
                  'target-free-explicit-home-prerequisite') and process['exit_code'] == 0
                  and type(process['exit_code']) is int and process['streams_complete'] is True
                  and process['timed_out'] is False and all(process[key] is None for key in (
                      'capture_exhausted', 'launch_error', 'capture_error', 'interrupted', 'cleanup_error')),
                  'Original prerequisite command or clean terminal receipt differs')
              combined = Read(stage / 'stdout.raw', 16384 if name == 'version' else 2 * 1024 * 1024)
              combined += Read(stage / 'stderr.raw', 16384)
              Require(re.findall(rb'Nuclei Engine Version:\s*v?([0-9A-Za-z.+-]+)', combined) == [b'3.4.10']
                  if name == 'version' else b'All templates validated successfully' in combined,
                  'Original exact-version/Go-validation bytes are missing or incompatible')

          print('One installed-image Nuclei prerequisite passed; no target, case or governed-HOME credit')
          PY
      - name: Preserve external target evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-juice-shop
          path: |
            functional-evidence/external-juice-shop/
            functional-evidence/external-native-benchmark/
            functional-evidence/external-nuclei-prerequisites/
            functional-evidence/nuclei-prerequisites.xml
          if-no-files-found: error
          retention-days: 14
