        env:
          ROUTING_RESULT: ${{ needs.saved-report-acceptance.result }}
          INTEGRATION_PROFILE: ${{ needs.saved-report-acceptance.outputs.integration_profile }}
        shell: bash
        run: |
          test "$ROUTING_RESULT" = success
          case "$INTEGRATION_PROFILE" in
