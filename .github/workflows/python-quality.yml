name: Python quality

on:
  pull_request:
    branches: [develop, master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-scope:
    uses: ./.github/workflows/passive-acceptance-routing.yml

  saved-report-acceptance:
    needs: integration-scope
    if: ${{ !cancelled() }}
    name: Saved report acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      integration_profile: ${{ needs.integration-scope.outputs.profile }}
    steps:
      - name: Require a completed independent routing decision
        if: needs.integration-scope.result != 'success'
        run: exit 1
      - name: Check out proposed source and merge base
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Classify the complete change using the base policy
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          profile=full
          accept=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == develop ]]; then
            [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
            ancestor=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA")
            [[ "$ancestor" =~ ^[0-9a-f]{40}$ ]]
            git diff --no-ext-diff --raw -z --no-renames "$ancestor" "$HEAD_SHA" -- > "$RUNNER_TEMP/report-changes"
            if git cat-file -e "$BASE_SHA:tools/saved_report_scope.py" 2>/dev/null; then
              git show "$BASE_SHA:tools/saved_report_scope.py" > "$RUNNER_TEMP/report-scope.py"
              profile=$(python3 -I "$RUNNER_TEMP/report-scope.py" < "$RUNNER_TEMP/report-changes")
              [[ "$profile" == full || "$profile" == saved-report ]]
            fi
            if [[ "$profile" == saved-report ]]; then
              accept=true
            elif git diff --quiet "$ancestor" "$HEAD_SHA" -- \
              tools/saved_report_scope.py tools/saved_report_acceptance.py \
              tests/unit/test_saved_report_acceptance.py tests/integration/test_finding_persistence.py; then
              accept=false
            else
              [[ $? == 1 ]]
              accept=true
            fi
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "accept=$accept" >> "$GITHUB_OUTPUT"
      - name: Select Python for saved-report acceptance
        if: steps.scope.outputs.accept == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Prepare the locked test environment
        if: steps.scope.outputs.accept == 'true'
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev --python 3.13
      - name: Run saved-report acceptance offline
        if: steps.scope.outputs.accept == 'true'
        shell: bash
        env:
          PROFILE: ${{ steps.scope.outputs.profile }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/coverage/saved-report-acceptance"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source.sha"
          python="$GITHUB_WORKSPACE/.venv/bin/python"
          "$python" -m pytest --version > "$evidence/pytest.txt"
          if [[ "$PROFILE" == saved-report ]]; then
            git worktree add --quiet --detach "$RUNNER_TEMP/report-oracle" "$BASE_SHA"
            cd "$RUNNER_TEMP/report-oracle"
          fi
          git rev-parse HEAD > "$evidence/oracle.sha"
          sudo -n /usr/bin/unshare --net -- /usr/bin/setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            /usr/bin/env "PYTHONPATH=$GITHUB_WORKSPACE/src:$PWD" \
            "$python" tools/saved_report_acceptance.py "$evidence/junit.xml"
      - name: Check changes to the saved-report policy
        if: steps.scope.outputs.accept == 'true' && steps.scope.outputs.profile == 'full'
        run: |
          .venv/bin/python -m ruff check tools/saved_report_*.py tests/unit/test_saved_report_acceptance.py
          .venv/bin/python -m pytest -o addopts='' -q \
            tests/unit/test_saved_report_acceptance.py \
            tests/unit/test_ci_workflows.py::test_EveryHeavyJobWaitsForFinalReadinessWithoutWeakeningTheGate \
            tests/unit/test_ci_workflows.py::test_ReadyFullChecksStopOnFailureWithoutNarrowingTheirSuccessfulGate \
            tests/unit/test_ci_workflows.py::test_NucleiPrerequisiteCheckpointSuppressesEveryOldExternalMode \
            tests/contract/test_external_native_benchmark.py::test_DraftNativeCheckpointRunsOnlyItsGenuineLaneBeforeTheFinalGate \
            --junitxml=coverage/saved-report-acceptance/policy.xml
      - name: Retain the source revision and actual test outcomes
        if: always() && steps.scope.outputs.accept == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saved-report-acceptance
          path: coverage/saved-report-acceptance/
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: saved-report-acceptance
    if: >-
      !cancelled() && (
      github.event_name == 'push' || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false) || (github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[native-image-protocol-checkpoint]'))
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[owned-response-protocol-checkpoint]')))
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
            # ADR 0120 records the measured branch-coverage budget for this runtime only.
            suite_timeout_seconds: 900
            job_timeout_minutes: 20
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.13"
            suite_timeout_seconds: 1500
            job_timeout_minutes: 30
          - os: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.saved-report-acceptance.outputs.integration_profile == 'passive' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && '0' || '1' }}
          ref: ${{ needs.saved-report-acceptance.outputs.integration_profile == 'passive' && github.event.pull_request.head.sha || github.sha }}
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Require an admitted integration profile
        env:
          ROUTING_RESULT: ${{ needs.saved-report-acceptance.result }}
          INTEGRATION_PROFILE: ${{ needs.saved-report-acceptance.outputs.integration_profile }}
        run: >-
          python -c "import os; assert os.environ['ROUTING_RESULT'] == 'success'; assert os.environ['INTEGRATION_PROFILE'] in ('passive', 'full'),
          'Develop integration is held until its complete change has passive admission'"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check owned transport lifecycle on Windows
        if: >-
          needs.saved-report-acceptance.outputs.integration_profile == 'full'
          && matrix.os == 'windows-2022' && (github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
        run: >-
          uv run --locked --extra dev pytest
          tests/integration/test_proxy_regression_workflow.py
          tests/integration/test_web_vulnerability_target.py
          -o addopts='' -q
          -k 'IndependentVerifyingClientRejectsTheActualSelfSignedCertificate or PartialHeader'
      - name: Run focused native image protocol checks
        timeout-minutes: 5
        if: >-
          needs.saved-report-acceptance.outputs.integration_profile == 'full' && (
          github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[native-image-protocol-checkpoint]'))
        run: >-
          uv run --locked --extra dev pytest -q -x --max-worker-restart=0
          --timeout=30 --timeout-method=thread -n 2 --dist=loadscope -o addopts='' --no-cov
          tests/unit/test_native_image_material_worker.py
          tests/unit/test_native_image_observation.py
          tests/unit/test_native_image_bounded_capture.py
          tests/unit/test_native_image_control_identity.py
          tests/unit/test_native_image_policy.py
          tests/unit/test_native_image_policy_oracle.py
          tests/unit/test_native_image_workflow.py
          tests/contract/test_native_image_cli.py
          --junitxml=functional-evidence/native-image-protocol.xml
      - name: Run focused owned response protocol checks
        timeout-minutes: 5
        if: >-
          needs.saved-report-acceptance.outputs.integration_profile == 'full' && (
          github.event_name == 'pull_request' && github.event.pull_request.draft == true
          && contains(github.event.pull_request.body, '[owned-response-protocol-checkpoint]'))
        run: >-
          uv run --locked --extra dev pytest -q -x --max-worker-restart=0
          --timeout=30 --timeout-method=thread -n 2 --dist=loadscope -o addopts='' --no-cov
          tests/unit/test_owned_response_capture.py
          tests/unit/test_owned_response_capture_worker.py
          tests/unit/test_owned_response_parent.py
          tests/unit/test_owned_response_workflow.py
          tests/unit/test_response_commands.py
          tests/unit/test_native_image_workflow.py
          tests/integration/test_owned_response_worker_execution.py
          --junitxml=functional-evidence/owned-response-protocol.xml
      - name: Run Python naming gate
        if: >-
          github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false)
        run: uv run --locked --extra dev python tools/python_naming.py
      - name: Run passive shared quality checks
        if: >-
          matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' &&
          github.event_name == 'pull_request' && github.base_ref == 'develop'
          && github.event.pull_request.draft == false
          && needs.saved-report-acceptance.outputs.integration_profile == 'passive'
        run: |
          uv run --locked --extra dev 1337-dev compile
          uv run --locked --extra dev 1337-dev lint
          uv run --locked --extra dev 1337-dev typecheck
          uv run --locked --extra dev 1337-dev performance
      - name: Run all passive unit tests with branch coverage
        if: >-
          matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' &&
          github.event_name == 'pull_request' && github.base_ref == 'develop'
          && github.event.pull_request.draft == false
          && needs.saved-report-acceptance.outputs.integration_profile == 'passive'
        env:
          PASSIVE_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run --locked --extra dev python tools/passive_test_gate.py
          --base "$PASSIVE_BASE" --suite-timeout ${{ matrix.suite_timeout_seconds || 600 }}
      - name: Build passive integration package
        if: >-
          matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' &&
          github.event_name == 'pull_request' && github.base_ref == 'develop'
          && github.event.pull_request.draft == false
          && needs.saved-report-acceptance.outputs.integration_profile == 'passive'
        run: uv run --locked --extra dev 1337-dev build
      - name: Run passive runtime compatibility tests
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'develop' &&
          needs.saved-report-acceptance.outputs.integration_profile == 'passive'
          && github.event.pull_request.draft == false && (
          matrix.os == 'windows-2022' || matrix.python == '3.14')
        run: >-
          uv run --locked --extra dev pytest --no-cov -n 2 --dist=loadscope
          --strict-config --strict-markers --max-worker-restart=0
          tests/unit/test_test_runner.py tests/unit/test_test_progress.py
          tests/unit/test_report_commands.py tests/unit/test_reporting.py
          tests/unit/test_workspace.py
          --timeout=120 -x
          --junitxml=functional-evidence/passive-runtime-compatibility.xml
      - name: Verify passive Windows TLS ownership and cleanup
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'develop' &&
          needs.saved-report-acceptance.outputs.integration_profile == 'passive'
          && github.event.pull_request.draft == false && matrix.os == 'windows-2022'
        run: >-
          uv run --locked --extra dev pytest --no-cov -n 0 --strict-config --strict-markers --timeout=120 -x
          tests/integration/test_proxy_regression_workflow.py::test_IndependentVerifyingClientRejectsTheActualSelfSignedCertificate
          --junitxml=functional-evidence/passive-windows-tls.xml
      - name: Run macOS quality checks before pytest
        if: >-
          (needs.saved-report-acceptance.outputs.integration_profile == 'passive' ||
          needs.saved-report-acceptance.outputs.integration_profile == 'full')
          && github.event_name == 'pull_request' && github.event.pull_request.draft == false
          && github.event.pull_request.base.ref == 'develop' && runner.os == 'macOS'
        run: |
          uv run --locked --extra dev 1337-dev compile
          uv run --locked --extra dev 1337-dev lint
          uv run --locked --extra dev 1337-dev typecheck
          uv run --locked --extra dev 1337-dev performance
      - name: Run focused macOS portability tests
        if: >-
          (needs.saved-report-acceptance.outputs.integration_profile == 'passive' ||
          needs.saved-report-acceptance.outputs.integration_profile == 'full')
          && github.event_name == 'pull_request' && github.event.pull_request.draft == false
          && github.event.pull_request.base.ref == 'develop' && runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          uv run --locked --extra dev pytest -q -x -n 0 --timeout=15 \
            --timeout-method=thread -o addopts='' --strict-config --strict-markers --no-cov \
            tests/unit/test_test_runner.py tests/unit/test_test_progress.py \
            tests/integration/test_workspace_lifecycle.py::test_WorkspaceLifecycleSurvivesReopenDerivedStateRemovalAndRelocation \
            --junitxml=functional-evidence/macos-portability.xml
      - name: Run macOS package build
        if: >-
          (needs.saved-report-acceptance.outputs.integration_profile == 'passive' ||
          needs.saved-report-acceptance.outputs.integration_profile == 'full')
          && github.event_name == 'pull_request' && github.event.pull_request.draft == false
          && github.event.pull_request.base.ref == 'develop' && runner.os == 'macOS'
        run: uv run --locked --extra dev 1337-dev build
      - name: Run repository quality gate
        if: >-
          needs.saved-report-acceptance.outputs.integration_profile == 'full' && (
          github.event_name == 'push' || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false))
          && !(github.event_name == 'pull_request'
          && github.event.pull_request.base.ref == 'develop' && runner.os == 'macOS')
        env:
          FUZZY1337_RUN_DESCENDANT_ACCEPTANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
          FUZZY1337_RUN_OWNED_RESPONSE_PRODUCT_ACCEPTANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: >-
          uv run --locked --extra dev 1337-dev check --fail-fast
          --suite-timeout ${{ matrix.suite_timeout_seconds || 600 }}
      - name: Preserve test and package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python }}-${{ matrix.os }}
          path: |
            coverage/
            dist/
            functional-evidence/
            performance/
          if-no-files-found: ignore
          retention-days: 14

  nuclei-governed-prerequisite-checkpoint:
    needs: integration-scope
    if: >-
      needs.integration-scope.outputs.profile == 'full' && (
      github.event_name == 'pull_request' && github.event.pull_request.draft == true
      && contains(github.event.pull_request.body, '[nuclei-governed-prerequisite-checkpoint]'))
    name: Target-free Nuclei governed no-HOME prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Execute one target-free governed no-HOME Nuclei prerequisite
        timeout-minutes: 17
        env:
          FUZZY1337_EXTERNAL_NUCLEI_GOVERNED_PREREQUISITES: linux-amd64
        run: >-
          uv run --locked --extra dev pytest
          tests/functional/test_external_nuclei_governed_prerequisites.py::test_InstalledImageRunsExactGovernedEnvironmentWithoutHome
          -o addopts='' --no-cov -n0 -v --timeout=600 --timeout-method=signal
          --junitxml=functional-evidence/nuclei-governed-prerequisites.xml
      - name: Require original no-HOME prerequisite evidence
        timeout-minutes: 1
        env:
          NUCLEI_GOVERNED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          source_identity="$(git rev-parse HEAD HEAD^{tree})"
          python - "$NUCLEI_GOVERNED_SOURCE_HEAD" "$source_identity" <<'PY'
          # SPDX-FileCopyrightText: 2026 Timur Gilmullin and Fuzzy Technologies
          # SPDX-License-Identifier: Apache-2.0

          """Read original prerequisite-only receipts; the host owns deep admission and Docker cleanup."""

          import json
          import re
          import sys
          from pathlib import Path
          from xml.etree import ElementTree


          def Require(condition: bool, message: str) -> None:
              """Refuse missing original proof without launching or repairing anything.

              Args:
                  condition: Exact predicate over retained original facts.
                  message: Fixed scope-specific failure diagnostic.

              Raises:
                  SystemExit: The required original fact is absent or differs.
              """

              if not condition:
                  raise SystemExit(message)


          def Read(path: Path, maximum: int = 2 * 1024 * 1024) -> bytes:
              """Read one bounded original file without accepting a symbolic alias.

              Args:
                  path: Fixed file beneath the original prerequisite evidence owner.
                  maximum: Inclusive byte ceiling for this one original record.

              Returns:
                  Complete original bytes, including an empty recorded stderr stream.

              Raises:
                  SystemExit: The file is aliased, not regular or oversized.
                  OSError: The original file is absent or cannot be read.
              """

              Require(not path.is_symlink() and path.is_file() and path.stat().st_size <= maximum,
                  "Missing, aliased or oversized prerequisite original")
              raw = path.read_bytes()
              Require(len(raw) <= maximum, "Prerequisite original grew beyond its bound")

              return raw


          def Json(path: Path) -> object:
              """Decode one original JSON document without importing the host or image helper.

              Args:
                  path: Fixed retained metadata path.

              Returns:
                  Parsed original document; no absent values are synthesized.
              """

              return json.loads(Read(path))


          expected = sys.argv[1]
          identity = sys.argv[2].splitlines()
          Require(len(identity) == 2 and expected == identity[0] and all(
              re.fullmatch('[a-f0-9]{40}', value) for value in identity),
              'Prerequisite source must be the exact checked-out PR head and tree')
          junit = ElementTree.fromstring(Read(Path('functional-evidence/nuclei-governed-prerequisites.xml')))
          suites, cases = list(junit.iter('testsuite')), list(junit.iter('testcase'))
          Require(len(suites) == len(cases) == 1 and all(suites[0].get(key) == value for key, value in (
              ('tests', '1'), ('failures', '0'), ('errors', '0'), ('skipped', '0'))) and (
              cases[0].get('classname') == 'tests.functional.test_external_nuclei_governed_prerequisites'
              and cases[0].get('name') == 'test_InstalledImageRunsExactGovernedEnvironmentWithoutHome'
              and not any(list(junit.iter(kind)) for kind in ('failure', 'error', 'skipped'))),
              'Require exactly one original prerequisite pass without skip/error/failure')
          runs = list(Path('functional-evidence/external-nuclei-prerequisites').glob('run-*'))
          Require(len(runs) == 1 and re.fullmatch('run-[a-f0-9]{12}', runs[0].name) is not None
              and runs[0].is_dir() and not runs[0].is_symlink(),
              'Require one fresh prerequisite evidence owner; stale or multiple runs refuse')
          root = runs[0]
          host = Json(root / 'host.json')
          Require(host['status'] == 'completed-governed-prerequisites' and host['source_revision'] == expected
              and host['source_tree'] == identity[1] and host['configured_target_inputs'] == []
              and host['governed_no_home_compatibility'] == 'established'
              and not any(key in host for key in ('failure', 'cleanup_failure',
                  'caller_cancellations_during_cleanup')),
              'Original completed host/source receipt or target-free scope differs')
          for field in ('image_id', 'container_id'):
              Require(re.fullmatch('sha256:[a-f0-9]{64}' if field == 'image_id' else '[a-f0-9]{64}',
                  host[field]) is not None, 'Host must retain actual immutable image/container IDs')

          base_id = Read(root / 'base.iid', 80).decode('ascii').strip()
          Require(re.fullmatch('sha256:[a-f0-9]{64}', base_id) is not None and base_id != host['image_id']
              and Read(root / 'runner.iid', 80).decode('ascii').strip() == host['image_id'],
              'Original base/runner image IDs must reconcile')
          cleanup = host['cleanup']
          Require(len(cleanup) == 3 and cleanup[0] == {'container_absent': True}
              and all(set(row) == {'tag', 'absent'} and row['absent'] is True for row in cleanup[1:]),
              'Completed host requires independent container and both image-tag absence receipts')
          owner = cleanup[1]['tag'].removeprefix('fuzzy1337-nuclei-runner-')
          Require(re.fullmatch('[a-f0-9]{32}', owner) is not None and root.name == 'run-' + owner[:12]
              and cleanup[1]['tag'] == 'fuzzy1337-nuclei-runner-' + owner
              and cleanup[2]['tag'] == 'fuzzy1337-nuclei-base-' + owner,
              'Cleanup receipts must belong to the one original run')
          context = Json(root / 'context-inventory.json')
          Require(context['revision'] == expected and context['tree'] == identity[1],
              'Original committed context must bind the selected source/tree')
          imported = root / 'imported'
          Require(Json(imported / 'prerequisites.json') == {
              'status': 'completed-governed-prerequisites', 'version_probe': 'completed',
              'go_template_validation': 'completed', 'governed_no_home_compatibility': 'established',
              'configured_target_inputs': [], 'independent_server_contact_count': None}
              and not (imported / 'failure.json').exists(),
              'Imported result must retain target-free prerequisite-only uncertainty')
          manifest = Json(imported / 'image-provisioning.json')
          Require(manifest['source_revision'] == expected and manifest['installed']['installed'][
              'source_revision'] == expected, 'Imported installed source must match the actual PR head')
          ARGUMENTS = {'version': ['/opt/benchmark-material/nuclei', '-version', '-duc'],
              'validate': ['/opt/benchmark-material/nuclei', '-validate', '-t',
                  '/opt/benchmark-material/prometheus-exposition.yaml', '-config',
                  '/opt/benchmark-material/operator-config.yaml', '-duc', '-ni', '-no-stdin',
                  '-pt', 'http', '-nc']}
          for name, argv in ARGUMENTS.items():
              stage = imported / name
              invocation, process = Json(stage / 'invocation.json'), Json(stage / 'process.json')
              Require(invocation['argv'] == argv and invocation['basis'] == (
                  'target-free-governed-no-home-prerequisite') and process['exit_code'] == 0
                  and type(process['exit_code']) is int and process['streams_complete'] is True
                  and invocation['environment'] == {'PATH': '/usr/local/bin:/usr/bin:/bin', 'LANG': 'C.UTF-8'}
                  and invocation['cwd'] == '/tmp/nuclei-governed-prerequisites/' + name
                  and process['timed_out'] is False and all(process[key] is None for key in (
                      'capture_exhausted', 'launch_error', 'capture_error', 'interrupted', 'cleanup_error')),
                  'Original prerequisite command or clean terminal receipt differs')
              combined = Read(stage / 'stdout.raw', 16384 if name == 'version' else 2 * 1024 * 1024)
              combined += Read(stage / 'stderr.raw', 16384)
              Require(re.findall(rb'Nuclei Engine Version:\s*v?([0-9A-Za-z.+-]+)', combined) == [b'3.4.10']
                  if name == 'version' else b'All templates validated successfully' in combined,
                  'Original exact-version/Go-validation bytes are missing or incompatible')

          print('One genuine no-HOME initialization passed; no target or application case credit')
          PY
      - name: Preserve original no-HOME prerequisite evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
