name: Resolve isolated documentation dependency update
on:
  push:
    branches: [fix/514-docs-lock-diagnostic]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed documentation baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 827548866f244ef1726dcd225d061912a5891f70
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Resolve documentation lock
        timeout-minutes: 3
        env:
          UV_NO_CONFIG: "1"
          UV_NO_BUILD: "1"
        run: |
          mkdir -p lock-evidence
          git rev-parse HEAD > lock-evidence/source.sha
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/requirements-api.txt")
          old = "mkdocstrings-python==2.0.10"
          data = path.read_text(encoding="utf-8")
          assert data.count(old) == 1
          path.write_text(data.replace(old, "mkdocstrings-python==2.0.11"), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv pip compile docs/requirements-api.txt -o docs/requirements-api.lock --generate-hashes --universal --upgrade-package mkdocstrings-python
          grep -F 'mkdocstrings-python==2.0.11 ' docs/requirements-api.lock
          cp docs/requirements-api.txt docs/requirements-api.lock lock-evidence/
      - name: Retain reviewed source and lock candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-dependency-lock
          path: lock-evidence/
          if-no-files-found: error
          retention-days: 7
