name: Close merged tasks

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-tasks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Close explicitly linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const pattern = /(?:^|\n)\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gim;
            const issueNumbers = new Set(
              Array.from(body.matchAll(pattern), (match) => Number(match[1])),
            );

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });

              if (issue.state !== "open" || issue.pull_request || issue.type?.name !== "Task") {
                core.info(`Skipping #${issue_number}: not an open native Task.`);
                continue;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${issue_number} after merge into develop.`);
            }

  complete-parent-features:
    needs: close-linked-tasks
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: complete-parent-features-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Complete verified native Features
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python tools/complete_features.py --repository "$GH_REPOSITORY"
