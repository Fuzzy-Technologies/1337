name: Reconcile native discovery planning
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'ops/native-discovery-planning' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const version = {'X-GitHub-Api-Version': '2026-03-10'};
            const get = async number => (await github.rest.issues.get({...repo, issue_number: number})).data;
            const child = await get(267);
            if (child.pull_request || child.title !== 'Implement bounded native discovery for Quick Scan' || child.milestone?.number !== 3) throw new Error('Unexpected native discovery task');
            await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {...repo, issue_number: 267, type: 'Task', headers: version});
            if ((await get(267)).type?.name !== 'Task') throw new Error('Native Task readback failed');
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values', {...repo, issue_number: 267, headers: version, issue_field_values: [{field_id: 22639629, value: 'High'}, {field_id: 22639632, value: 'High'}]});
            const fields = (await get(267)).issue_field_values;
            if (!fields?.some(x => x.issue_field_name === 'Priority' && x.single_select_option?.name === 'High') || !fields?.some(x => x.issue_field_name === 'Effort' && x.single_select_option?.name === 'High')) throw new Error('Planning fields readback failed');
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {...repo, issue_number: 51, sub_issue_id: child.id, replace_parent: true, headers: version});
            const children = (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {...repo, issue_number: 51, headers: version})).data;
            if (!children.some(x => x.number === 267)) throw new Error('Native parent readback failed');
            const graphTask = await get(55);
            if (graphTask.type?.name !== 'Task' || graphTask.milestone?.number !== 5) throw new Error('Unexpected graph task');
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {...repo, issue_number: 52, sub_issue_id: graphTask.id, replace_parent: true, headers: version});
            const graphChildren = (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {...repo, issue_number: 52, headers: version})).data;
            if (!graphChildren.some(x => x.number === 55) || (await get(55)).milestone?.number !== 5) throw new Error('Graph parent readback failed');
            core.info('Native discovery Task and graph ownership verified.');
            await github.rest.pulls.update({...repo, pull_number: context.issue.number, state: 'closed'});
            await github.rest.git.deleteRef({...repo, ref: 'heads/ops/native-discovery-planning'});
