{
  "name": "Saved Kubernetes interoperability, model storage reproduction and report test timing",
  "on": {
    "push": {
      "branches": [
        "feature/retained-report-hosted-proof"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "APPROVED_SOURCE_SHA": "e6d15fdc2d91a0e2bd3c6383ae6badd594468b76",
    "PRODUCT_TREE": "624a28f777271ce2236105c7742fc03b8959e3ff"
  },
  "jobs": {
    "offline-milestones": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Require the dedicated read-only proof invocation",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Fuzzy-Technologies/1337\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REF\" = refs/heads/feature/retained-report-hosted-proof\n[[ \"$APPROVED_SOURCE_SHA\" =~ ^[0-9a-f]{40}$ && \"$APPROVED_SOURCE_SHA\" =~ [1-9a-f] ]]\n"
        },
        {
          "name": "Check out the reviewed disposable workflow and helper",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Retain the reviewed offline test driver from this workflow commit",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git --no-replace-objects rev-parse HEAD)\" = \"$GITHUB_SHA\"\nfor filename in milestone-checks.py model-before.py report-schema-profile.py; do\npath=\".github/proof/$filename\"\nentry=\"$(git --no-replace-objects ls-tree \"$GITHUB_SHA\" -- \"$path\")\"\n[[ \"$entry\" == \"100644 blob \"*$'\\t'\"$path\" ]]\ngit --no-replace-objects show \"$GITHUB_SHA:$path\" > \"$RUNNER_TEMP/$filename\"\ndone\n"
        },
        {
          "name": "Check out the corrected business, CWE and SemVer reference tree for the wheel comparison",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "2297424c76576b1636e835025e175be7f8d055c1",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Pin the documentation-only correction for an independent wheel rebuild",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 2297424c76576b1636e835025e175be7f8d055c1\ntest \"$(git rev-parse HEAD^{tree})\" = c6d56168f82e8c97fa13c37cff6c1be433e39c8f\nmkdir -p \"$RUNNER_TEMP/business-reference\"\ngit archive --format=tar HEAD | tar -xf - -C \"$RUNNER_TEMP/business-reference\"\n"
        },
        {
          "name": "Replace checkout with only the immutable product source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ env.APPROVED_SOURCE_SHA }}",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Python 3.13",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Build and separately install the actual wheel with locked dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$APPROVED_SOURCE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$PRODUCT_TREE\"\ntest -f tests/unit/test_kubernetes_inventory.py\npython -m pip install --disable-pip-version-check uv==0.11.33\nruntime=\"$RUNNER_TEMP/retained-proof-runtime\"\nUV_PROJECT_ENVIRONMENT=\"$runtime\" uv sync --locked --extra dev --no-install-project --python \"$(command -v python)\"\n\"$runtime/bin/python\" -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/proof-dist\"\nset -- \"$RUNNER_TEMP/proof-dist/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\nuv pip install --python \"$runtime/bin/python\" --no-deps \"$1\"\nuv pip check --python \"$runtime/bin/python\"\n\"$runtime/bin/python\" -I - \"$1\" <<'PY'\n\"\"\"Pin the actual separately installed wheel without importing checkout production code.\"\"\"\nimport hashlib\nimport json\nimport os\nimport sys\nfrom pathlib import Path\nimport fuzzy1337\n\nmodule = Path(fuzzy1337.__file__).resolve()\nassert module.is_relative_to(Path(sys.prefix).resolve()), \"Require installed wheel code\"\nassert not module.is_relative_to(Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()), (\n    \"An editable checkout cannot establish wheel acceptance\"\n)\nwheel = Path(sys.argv[1])\nrecord = {\"filename\": wheel.name, \"sha256\": hashlib.sha256(wheel.read_bytes()).hexdigest(),\n          \"python\": sys.version.split()[0], \"installed_module\": str(module)}\nwith (Path(os.environ[\"RUNNER_TEMP\"]) / \"hosted-proof-wheel.json\").open(\"x\") as stream:\n    json.dump(record, stream, sort_keys=True)\nPY\necho \"$runtime/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run the actual installed CLI and offline SDK tests on two workers",
          "shell": "bash",
          "run": "python3 -I \"$RUNNER_TEMP/milestone-checks.py\""
        },
        {
          "name": "Rebuild the final documentation-corrected three-milestone wheel and compare all bytes",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/business-reference\"\npython3 -I -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/business-wheel\"\nset -- \"$RUNNER_TEMP/business-wheel/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\npython3 -I - \"$1\" <<'PY'\nimport hashlib, sys\nfrom pathlib import Path\nvalue = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()\nassert value == \"6bf6ff8564fcd66b1dbb8c024370626841da811d7af7bc0a6998b185dc735d9c\", value\nprint(\"CORRECTED_BUSINESS_WHEEL\", value)\nPY\n"
        },
        {
          "name": "Observe the original installed SDK storage failure on the unchanged model source in isolated temporary workspaces",
          "shell": "bash",
          "run": "set -euo pipefail\nexpected=$(git rev-parse $APPROVED_SOURCE_SHA:src/fuzzy1337/model.py)\ntest \"$expected\" = 7179eafdc841c9da642262c4a529ec0b16c3c40b\ncd \"$RUNNER_TEMP\"\npython3 -I \"$RUNNER_TEMP/model-before.py\"\n"
        },
        {
          "name": "Read the existing Linux timing artifact",
          "id": "previous_unit_timings",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": "45672277785",
            "artifact-ids": "15050192700",
            "path": "${{ runner.temp }}/earlier-ubuntu",
            "skip-decompress": true,
            "digest-mismatch": "error"
          }
        },
        {
          "name": "Time schema checks on four saved-report modules against the original native unit test IDs",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 -I - <<'PY'\nimport hashlib, os, zipfile\nfrom pathlib import Path\nroot = Path(os.environ[\"RUNNER_TEMP\"])\narchive, = [p for p in (root / \"earlier-ubuntu\").rglob(\"*\") if p.is_file()]\nassert hashlib.sha256(archive.read_bytes()).hexdigest() == \"a2dde7116ef752a29526dd25b640455c4cc080dc704364e54010f3e6252f2148\"\nwith zipfile.ZipFile(archive) as z:\n    record = z.getinfo(\"coverage/passive-units-parallel.xml\")\n    assert record.file_size < 32 * 1024 * 1024\n    (root / \"native-unit.xml\").write_bytes(z.read(record))\nPY\npython3 -I -m py_compile \"$RUNNER_TEMP/report-schema-profile.py\"\npython3 -I \"$RUNNER_TEMP/report-schema-profile.py\" \"$RUNNER_TEMP/native-unit.xml\" \"$RUNNER_TEMP/report-schema-profile\"\n"
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read"
      }
    }
  }
}
