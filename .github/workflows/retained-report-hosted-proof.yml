{
  "name": "Verify the CI change and replay the real two-file development pull request",
  "on": {
    "push": {
      "branches": [
        "feature/retained-report-hosted-proof"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "APPROVED_SOURCE_SHA": "e4b3a53db16a4d804755b0b7b7244d2c396b525c",
    "PRODUCT_TREE": "189373aaae0901ec0903b5e41200a54643d02533"
  },
  "jobs": {
    "offline-milestones": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "steps": [
        {
          "name": "Require the dedicated read-only proof invocation",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Fuzzy-Technologies/1337\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REF\" = refs/heads/feature/retained-report-hosted-proof\n[[ \"$APPROVED_SOURCE_SHA\" =~ ^[0-9a-f]{40}$ && \"$APPROVED_SOURCE_SHA\" =~ [1-9a-f] ]]\n"
        },
        {
          "name": "Check out the reviewed disposable workflow and helper",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Retain the reviewed offline test driver from this workflow commit",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git --no-replace-objects rev-parse HEAD)\" = \"$GITHUB_SHA\"\nfor filename in milestone-checks.py historical-profile.py; do\npath=\".github/proof/$filename\"\nentry=\"$(git --no-replace-objects ls-tree \"$GITHUB_SHA\" -- \"$path\")\"\n[[ \"$entry\" == \"100644 blob \"*$'\\t'\"$path\" ]]\ngit --no-replace-objects show \"$GITHUB_SHA:$path\" > \"$RUNNER_TEMP/$filename\"\ndone\n"
        },
        {
          "name": "Check out exactly the historical PR head and both parents",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "79912c8467a23f8b806078f5f0738e01eb76d205",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 2,
            "path": "historical-p65"
          }
        },
        {
          "name": "Move the authentic historical checkout outside the candidate workspace",
          "shell": "bash",
          "run": "set -euo pipefail\nhistorical=\"$GITHUB_WORKSPACE/historical-p65\"\ntest \"$(git -C \"$historical\" rev-parse HEAD)\" = 79912c8467a23f8b806078f5f0738e01eb76d205\ntest \"$(git -C \"$historical\" rev-parse HEAD^1)\" = 84d1101b3de10da09f89881f523a032cd909d696\ntest \"$(git -C \"$historical\" rev-parse HEAD^2)\" = b63d113396ff9daa9e7d27dce1512a5306f980d6\ntest \"$(git -C \"$historical\" rev-parse HEAD^{tree})\" = d799aab5e060546ec022180c4a5f60763671d3f4\nmv \"$historical\" \"$RUNNER_TEMP/real-p65-history\"\n"
        },
        {
          "name": "Replace checkout with only the immutable product source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ env.APPROVED_SOURCE_SHA }}",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Python 3.13",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Build and separately install the actual wheel with locked dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$APPROVED_SOURCE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$PRODUCT_TREE\"\ntest -f tools/passive_test_gate.py\npython -m pip install --disable-pip-version-check uv==0.11.33\nruntime=\"$RUNNER_TEMP/retained-proof-runtime\"\nUV_PROJECT_ENVIRONMENT=\"$runtime\" uv sync --locked --extra dev --no-install-project --python \"$(command -v python)\"\n\"$runtime/bin/python\" -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/proof-dist\"\nset -- \"$RUNNER_TEMP/proof-dist/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\nuv pip install --python \"$runtime/bin/python\" --no-deps \"$1\"\nuv pip check --python \"$runtime/bin/python\"\n\"$runtime/bin/python\" -I - \"$1\" <<'PY'\n\"\"\"Pin the actual separately installed wheel without importing checkout production code.\"\"\"\nimport hashlib\nimport json\nimport os\nimport sys\nfrom pathlib import Path\nimport fuzzy1337\n\nmodule = Path(fuzzy1337.__file__).resolve()\nassert module.is_relative_to(Path(sys.prefix).resolve()), \"Require installed wheel code\"\nassert not module.is_relative_to(Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()), (\n    \"An editable checkout cannot establish wheel acceptance\"\n)\nwheel = Path(sys.argv[1])\nrecord = {\"filename\": wheel.name, \"sha256\": hashlib.sha256(wheel.read_bytes()).hexdigest(),\n          \"python\": sys.version.split()[0], \"installed_module\": str(module)}\nwith (Path(os.environ[\"RUNNER_TEMP\"]) / \"hosted-proof-wheel.json\").open(\"x\") as stream:\n    json.dump(record, stream, sort_keys=True)\nPY\necho \"$runtime/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run the candidate gate regression tests, collection policies, style and naming",
          "shell": "bash",
          "run": "python3 -I \"$RUNNER_TEMP/milestone-checks.py\""
        },
        {
          "name": "Download the original complete #537 Ubuntu JUnit artifact",
          "id": "previous_unit_timings",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": "45674257034",
            "artifact-ids": "15052005768",
            "path": "${{ runner.temp }}/earlier-537",
            "skip-decompress": true,
            "digest-mismatch": "error"
          }
        },
        {
          "name": "Verify historical bytes, install the original product and execute the reviewed quick gate once",
          "shell": "bash",
          "run": "set -euo pipefail\nroot=\"$GITHUB_WORKSPACE\"\nhist=\"$RUNNER_TEMP/real-p65-history\"\nruntime=\"$RUNNER_TEMP/retained-proof-runtime\"\nhelper=\"$RUNNER_TEMP/p65-tools\"\nmkdir -p \"$helper\"\ncp \"$root/tools/passive_test_gate.py\" \"$root/tools/python_naming.py\" \"$helper/\"\ncmp \"$root/uv.lock\" \"$hist/uv.lock\"\ncmp \"$root/pyproject.toml\" \"$hist/pyproject.toml\"\npython3 -I - <<'PY'\nimport os,hashlib,zipfile\nfrom pathlib import Path\ntmp = Path(os.environ[\"RUNNER_TEMP\"])\narchive, = [p for p in (tmp / \"earlier-537\").rglob(\"*\") if p.is_file()]\nassert hashlib.sha256(archive.read_bytes()).hexdigest() == \"450fb3faece7630008c8ff359c36c4d46b49fba60af766e75aff8312bd4d13c7\"\nwith zipfile.ZipFile(archive) as z:\n    entry, = [m for m in z.infolist() if m.filename == \"coverage/passive-units-parallel.xml\"]\n    assert entry.file_size < 32*1024*1024\n    raw = z.read(entry)\n    assert len(raw) == entry.file_size\n    (tmp / \"historic-native.xml\").write_bytes(raw)\n    (tmp / \"historic-native.sha256\").write_text(hashlib.sha256(raw).hexdigest())\nPY\n\"$runtime/bin/python\" -I -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/historic-wheel\" \"$hist\"\nset -- \"$RUNNER_TEMP/historic-wheel/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\nuv pip install --python \"$runtime/bin/python\" --reinstall --no-deps \"$1\"\ncd \"$RUNNER_TEMP\"\nif ! \"$runtime/bin/python\" -I \"$RUNNER_TEMP/historical-profile.py\" --source-root \"$hist\" --candidate-tools \"$helper\" --gate-blob e471d0ffdbada11514e3a8e1d0071e2f930183ab --naming-blob 1748583602d6eec3e9bb2b2cf417bc2e91038865 --baseline-xml \"$RUNNER_TEMP/historic-native.xml\" --baseline-xml-sha256 \"$(cat \"$RUNNER_TEMP/historic-native.sha256\")\" --output \"$RUNNER_TEMP/p65-proof\"; then\n  if test -f \"$RUNNER_TEMP/p65-proof/candidate-gate.log\"; then tail -n 40 \"$RUNNER_TEMP/p65-proof/candidate-gate.log\"; fi\n  exit 1\nfi\n\"$runtime/bin/python\" -I - <<'PY'\nimport json,os,hashlib\nfrom pathlib import Path\ntmp=Path(os.environ[\"RUNNER_TEMP\"])\npath=tmp/\"p65-proof/historical-p65-benchmark.json\"\ndata=json.loads(path.read_bytes())\nprint(\"P65_HISTORICAL_RECEIPT\",json.dumps({k:data[k] for k in (\"source\",\"base\",\"tree\",\"gate_blob\",\"installed_python_files\",\"baseline_xml_sha256\",\"controls\",\"wall_seconds\",\"cases_by_file\",\"original_pytest_seconds\")},sort_keys=True))\nprint(\"P65_JUNIT_IDENTITIES\",len(data[\"nodeids\"]),hashlib.sha256(path.read_bytes()).hexdigest())\nPY\n"
        },
        {
          "name": "Retain the historical proof and measured candidate case identities",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "passive-historical-537-proof",
            "path": "${{ runner.temp }}/p65-proof\n${{ runner.temp }}/p65-focused.xml",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read"
      }
    }
  }
}
