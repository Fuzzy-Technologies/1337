{
  "name": "Offline CLI acceptance and Python naming equivalence",
  "on": {
    "push": {
      "branches": [
        "feature/retained-report-hosted-proof"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "FEATURE_SHA": "ad2e2eab434eafd016bef3b4abd1ad0f3cb77301",
    "FEATURE_TREE": "4c28b2524a058fe3347f6f76d28258c981c6b540",
    "STYLE_SHA": "de9f2cb729c974126a6cdc00c1d2d96976577415",
    "STYLE_TREE": "d799aab5e060546ec022180c4a5f60763671d3f4",
    "STYLE_BASE": "ad2e2eab434eafd016bef3b4abd1ad0f3cb77301",
    "APPROVED_SOURCE_SHA": "ad2e2eab434eafd016bef3b4abd1ad0f3cb77301"
  },
  "jobs": {
    "offline-group": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Require the dedicated read-only proof invocation",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Fuzzy-Technologies/1337\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REF\" = refs/heads/feature/retained-report-hosted-proof\n[[ \"$APPROVED_SOURCE_SHA\" =~ ^[0-9a-f]{40}$ && \"$APPROVED_SOURCE_SHA\" =~ [1-9a-f] ]]\n"
        },
        {
          "name": "Check out the reviewed disposable workflow and helper",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Retain the two reviewed test drivers from this workflow commit",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nfor name in offline-group private-locals-proof; do\n  path=\".github/proof/$name.py\"\n  test \"$(git ls-tree HEAD -- \"$path\" | cut -d\" \" -f1)\" = 100644\n  git --no-replace-objects show \"HEAD:$path\" > \"$RUNNER_TEMP/$name.py\"\ndone"
        },
        {
          "name": "Check out the exact IOC and shell product commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ env.FEATURE_SHA }}",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Python 3.13",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Build and separately install the actual wheel with locked dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$APPROVED_SOURCE_SHA\"\ntest -f tests/e2e/test_ioc_bundle_candidate_export_cli.py\ntest -f tests/unit/test_ioc_bundle_candidate_export.py\npython -m pip install --disable-pip-version-check uv==0.11.33\nruntime=\"$RUNNER_TEMP/retained-proof-runtime\"\nUV_PROJECT_ENVIRONMENT=\"$runtime\" uv sync --locked --extra dev --no-install-project --python \"$(command -v python)\"\n\"$runtime/bin/python\" -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/proof-dist\"\nset -- \"$RUNNER_TEMP/proof-dist/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\nuv pip install --python \"$runtime/bin/python\" --no-deps \"$1\"\nuv pip check --python \"$runtime/bin/python\"\n\"$runtime/bin/python\" -I - \"$1\" <<'PY'\n\"\"\"Pin the actual separately installed wheel without importing checkout production code.\"\"\"\nimport hashlib\nimport json\nimport os\nimport sys\nfrom pathlib import Path\nimport fuzzy1337\n\nmodule = Path(fuzzy1337.__file__).resolve()\nassert module.is_relative_to(Path(sys.prefix).resolve()), \"Require installed wheel code\"\nassert not module.is_relative_to(Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()), (\n    \"An editable checkout cannot establish wheel acceptance\"\n)\nwheel = Path(sys.argv[1])\nrecord = {\"filename\": wheel.name, \"sha256\": hashlib.sha256(wheel.read_bytes()).hexdigest(),\n          \"python\": sys.version.split()[0], \"installed_module\": str(module)}\nwith (Path(os.environ[\"RUNNER_TEMP\"]) / \"hosted-proof-wheel.json\").open(\"x\") as stream:\n    json.dump(record, stream, sort_keys=True)\nPY\necho \"$runtime/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run the installed IOC console, error-path tests and interactive help checks",
          "shell": "bash",
          "run": "python3 -I \"$RUNNER_TEMP/offline-group.py\" feature"
        },
        {
          "name": "Check out the exact style-only candidate and its feature parent",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ env.STYLE_SHA }}",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Prove source equivalence, baseline removals and execute the existing offline cases",
          "shell": "bash",
          "run": "python3 -I \"$RUNNER_TEMP/offline-group.py\" style"
        }
      ]
    }
  }
}
