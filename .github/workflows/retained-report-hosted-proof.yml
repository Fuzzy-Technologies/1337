{
  "name": "Saved business declarations, strict extension versions and offline CWE lookup",
  "on": {
    "push": {
      "branches": [
        "feature/retained-report-hosted-proof"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "APPROVED_SOURCE_SHA": "0b0e6d665da07dae36a2780280cc081b70f0cf02",
    "PRODUCT_TREE": "c0a5c28f607c851ed0152a8b93705d8eb0243d58"
  },
  "jobs": {
    "offline-milestones": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Require the dedicated read-only proof invocation",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Fuzzy-Technologies/1337\ntest \"$GITHUB_EVENT_NAME\" = push\ntest \"$GITHUB_REF\" = refs/heads/feature/retained-report-hosted-proof\n[[ \"$APPROVED_SOURCE_SHA\" =~ ^[0-9a-f]{40}$ && \"$APPROVED_SOURCE_SHA\" =~ [1-9a-f] ]]\n"
        },
        {
          "name": "Check out the reviewed disposable workflow and helper",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Retain the reviewed offline test driver from this workflow commit",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git --no-replace-objects rev-parse HEAD)\" = \"$GITHUB_SHA\"\npath=.github/proof/milestone-checks.py\nentry=\"$(git --no-replace-objects ls-tree \"$GITHUB_SHA\" -- \"$path\")\"\n[[ \"$entry\" == \"100644 blob \"*$'\\t'\"$path\" ]]\ngit --no-replace-objects show \"$GITHUB_SHA:$path\" > \"$RUNNER_TEMP/milestone-checks.py\"\n"
        },
        {
          "name": "Replace checkout with only the immutable product source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ env.APPROVED_SOURCE_SHA }}",
            "clean": true,
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Python 3.13",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Build and separately install the actual wheel with locked dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$APPROVED_SOURCE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$PRODUCT_TREE\"\ntest -f tests/unit/test_business_commands.py\npython -m pip install --disable-pip-version-check uv==0.11.33\nruntime=\"$RUNNER_TEMP/retained-proof-runtime\"\nUV_PROJECT_ENVIRONMENT=\"$runtime\" uv sync --locked --extra dev --no-install-project --python \"$(command -v python)\"\n\"$runtime/bin/python\" -m build --wheel --no-isolation --outdir \"$RUNNER_TEMP/proof-dist\"\nset -- \"$RUNNER_TEMP/proof-dist/\"*.whl\ntest \"$#\" -eq 1 && test -f \"$1\"\nuv pip install --python \"$runtime/bin/python\" --no-deps \"$1\"\nuv pip check --python \"$runtime/bin/python\"\n\"$runtime/bin/python\" -I - \"$1\" <<'PY'\n\"\"\"Pin the actual separately installed wheel without importing checkout production code.\"\"\"\nimport hashlib\nimport json\nimport os\nimport sys\nfrom pathlib import Path\nimport fuzzy1337\n\nmodule = Path(fuzzy1337.__file__).resolve()\nassert module.is_relative_to(Path(sys.prefix).resolve()), \"Require installed wheel code\"\nassert not module.is_relative_to(Path(os.environ[\"GITHUB_WORKSPACE\"]).resolve()), (\n    \"An editable checkout cannot establish wheel acceptance\"\n)\nwheel = Path(sys.argv[1])\nrecord = {\"filename\": wheel.name, \"sha256\": hashlib.sha256(wheel.read_bytes()).hexdigest(),\n          \"python\": sys.version.split()[0], \"installed_module\": str(module)}\nwith (Path(os.environ[\"RUNNER_TEMP\"]) / \"hosted-proof-wheel.json\").open(\"x\") as stream:\n    json.dump(record, stream, sort_keys=True)\nPY\necho \"$runtime/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run the actual installed CLI and offline SDK tests on two workers",
          "shell": "bash",
          "run": "python3 -I \"$RUNNER_TEMP/milestone-checks.py\""
        },
        {
          "name": "Read the existing Linux timing artifact",
          "id": "previous_unit_timings",
          "if": "always()",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "continue-on-error": true,
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": "45672277785",
            "artifact-ids": "15050192700",
            "path": "${{ runner.temp }}/earlier-ubuntu",
            "skip-decompress": true,
            "digest-mismatch": "error"
          }
        },
        {
          "name": "Summarize previously executed unit cases without rerunning the suite",
          "if": "always() && steps.previous_unit_timings.outcome == 'success'",
          "shell": "bash",
          "run": "python3 -I - <<'PY'\nimport hashlib, json, os, zipfile\nfrom collections import defaultdict\nfrom pathlib import Path\nfrom xml.etree import ElementTree\nroot = Path(os.environ[\"RUNNER_TEMP\"]) / \"earlier-ubuntu\"\narchives = [p for p in root.rglob(\"*\") if p.is_file()]\nassert len(archives) == 1\narchive = archives[0]\nassert hashlib.sha256(archive.read_bytes()).hexdigest() == \"a2dde7116ef752a29526dd25b640455c4cc080dc704364e54010f3e6252f2148\"\nwith zipfile.ZipFile(archive) as z:\n    metadata = [m for m in z.infolist() if m.filename.lower().endswith(\".xml\") and m.file_size < 32*1024*1024]\n    print(\"PRIOR_XML_FILES\", json.dumps([m.filename for m in metadata]))\n    observed = {}\n    for member in metadata:\n        tree = ElementTree.fromstring(z.read(member))\n        for test in tree.iter(\"testcase\"):\n            module = test.get(\"classname\", \"\")\n            if not (module.startswith(\"tests.unit.\") or \"/unit/\" in member.filename or \"unit\" in member.filename.lower()):\n                continue\n            if test.find(\"skipped\") is not None:\n                continue\n            key = (module, test.get(\"name\", \"\"))\n            duration = float(test.get(\"time\", 0))\n            observed[key] = max(duration, observed.get(key, 0))\n    totals = defaultdict(float)\n    for (module, name), duration in observed.items():\n        totals[module] += duration\n    print(\"PRIOR_TIMINGS\", json.dumps({\"unique_unit_cases\": len(observed), \"top_cases\": [\n        [module, name, round(time, 3)] for (module, name), time in sorted(observed.items(), key=lambda p:-p[1])[:24]],\n        \"top_modules\": [[k, round(v, 3)] for k, v in sorted(totals.items(), key=lambda p:-p[1])[:22]]}))\nPY\n"
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read"
      }
    }
  }
}
