name: Genuine owned content header pipeline

on:
  pull_request:
    branches: [develop, master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: owned-content-header-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-content-header:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' &&
      (github.event.pull_request.draft == false ||
      contains(github.event.pull_request.body, '[owned-content-header-checkpoint]')))
    name: Installed fresh content header and relocated replay
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FUZZY1337_RUN_OWNED_CONTENT_HEADER_ACCEPTANCE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned environment tool
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked development tools
        run: uv sync --locked --extra dev --python 3.14
      - name: Execute the one fresh installed content header pipeline
        timeout-minutes: 3
        run: >-
          uv run --locked --extra dev pytest
          tests/functional/test_owned_content_response_sdk_pipeline.py::test_InstalledFreshContentHeaderPipelineRetainsAcknowledgedFindingAndRelocatedReplay
          -q -x -n0 --no-cov --timeout=150 --timeout-method=thread
          --junitxml=functional-evidence/owned-content-header.xml
      - name: Require one genuine pass and original pipeline result
        run: >-
          uv run --locked --extra dev python -m tests.contract.owned_content_response_ci_evidence
          functional-evidence/owned-content-header.xml functional-evidence/owned-content-sdk
      - name: Preserve original installation process source and offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-content-header-original-evidence
          path: |
            functional-evidence/owned-content-header.xml
            functional-evidence/owned-content-sdk/
          retention-days: 14
          if-no-files-found: error

  content-unit-windows-checkpoint:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, '[owned-content-unit-windows-checkpoint]')
    name: Focused Windows owned-content unit portability
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned environment tool
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked development tools
        run: uv sync --locked --extra dev --python 3.12
      - name: Execute all focused Windows content unit cases
        timeout-minutes: 3
        run: >-
          uv run --locked --extra dev pytest tests/unit
          -k 'owned_content_response or native_content_response_header_workflow'
          -q -n2 --no-cov
          --junitxml=functional-evidence/owned-content-unit-windows.xml
      - name: Require executed unit cases without failures or errors
        shell: python
        run: |
          # SPDX-FileCopyrightText: 2026 Timur Gilmullin and Fuzzy Technologies
          # SPDX-License-Identifier: Apache-2.0

          """Require actual focused unit execution; skipped-only reports are not acceptance."""

          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path('functional-evidence/owned-content-unit-windows.xml')).getroot()
          cases = list(root.iter('testcase'))
          executed = [case for case in cases if case.find('skipped') is None]

          if not executed or any(list(root.iter(kind)) for kind in ('failure', 'error')):
              raise SystemExit('Focused Windows units require actual cases and no failures/errors')

          print(f'Focused Windows units: {len(executed)} executed, {len(cases) - len(executed)} skipped')
      - name: Preserve original Windows content unit JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-content-unit-windows-original-evidence
          path: functional-evidence/owned-content-unit-windows.xml
          retention-days: 14
          if-no-files-found: error

