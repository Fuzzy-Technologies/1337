        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned environment tool
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked development tools
        run: uv sync --locked --extra dev --python 3.14
      - name: Execute the one fresh controlled actor mismatch
