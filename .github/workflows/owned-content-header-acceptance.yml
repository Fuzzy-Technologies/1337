          tests/functional/test_owned_content_response_sdk_pipeline.py::test_InstalledFreshActorDriftContentHeaderPipelinePreservesAcquiredStateWithoutAssessment
          -q -x -n0 --no-cov --timeout=150 --timeout-method=thread
          --junitxml=functional-evidence/owned-content-header-actor-denied.xml
      - name: Require two actual actor reads and a refusal without writes
        run: >-
          uv run --locked --extra dev python
          -m tests.contract.owned_content_response_ci_actor_evidence
          functional-evidence/owned-content-header-actor-denied.xml functional-evidence/owned-content-sdk
      - name: Preserve original controlled actor refusal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
