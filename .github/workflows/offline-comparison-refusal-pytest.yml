name: Offline saved comparison refusals

on:
  push:
    branches: [fix/118-offline-refusal-pytest]

permissions:
  contents: read

jobs:
  comparison:
    name: Selected offline comparison refusal test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact Draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eacf38dded62f5711a41a53181d479a25dc6b96e
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned uv and locked test dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev --no-install-project
      - name: Run the saved-report test with the sole offline comparator child allowed
        timeout-minutes: 2
        env:
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          mkdir -p .offline-refusal-evidence .offline-python-guard
          git rev-parse HEAD > .offline-refusal-evidence/source.sha
          test "$(cat .offline-refusal-evidence/source.sha)" = eacf38dded62f5711a41a53181d479a25dc6b96e
          export OFFLINE_WORKSPACE="$PWD"
          export PYTHONPATH="$PWD/.offline-python-guard:$PWD/src"
          unset PYTEST_ADDOPTS PYTEST_PLUGINS
          cat > .offline-python-guard/sitecustomize.py <<'GUARD'
          import os
          from pathlib import Path
          import sys

          root = Path(os.environ["OFFLINE_WORKSPACE"]).resolve()
          comparator = root / "tools/compare_functional_reports.py"
          python = Path(sys.executable).resolve()
          is_comparator = Path(sys.argv[0]).resolve() == comparator
          ARMED = True

          def RefuseExternalEffects(event, args):
              if event == "subprocess.Popen":
                  executable, argv, cwd, environment = args
                  if (
                      not is_comparator and environment is None
                      and isinstance(argv, (list, tuple)) and len(argv) >= 4
                      and Path(executable).resolve() == python
                      and Path(argv[0]).resolve() == python
                      and Path(argv[1]).resolve() == comparator
                      and cwd is not None and Path(cwd).resolve() == root
                  ):
                      return
              if event.startswith(("socket.", "subprocess.")) or event in {
                  "os.exec", "os.fork", "os.forkpty", "os.posix_spawn", "os.spawn", "os.system", "os.startfile",
              }:
                  raise RuntimeError(f"Offline pytest blocked {event}")

          sys.addaudithook(RefuseExternalEffects)
          GUARD
          .venv/bin/python - <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree
          import sitecustomize

          assert sitecustomize.ARMED, "Offline guard did not load"
          import pytest

          report = ".offline-refusal-evidence/results.xml"
          result = pytest.main([
              "--strict-config", "--strict-markers", "--noconftest", "-p", "no:cacheprovider",
              "-o", "addopts=", "-q",
              "tests/contract/test_functional_report_comparison.py::test_OfflineToolRunsDeterministicallyAndLeavesOriginalInputsUntouched",
              f"--junitxml={report}",
          ])
          if result != pytest.ExitCode.OK:
              sys.exit(result)
          root = ElementTree.parse(report).getroot()
          cases = list(root.iter("testcase"))
          if len(cases) != 1 or any(
              case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")
          ):
              sys.exit("The single selected case must complete successfully.")
          PY
      - name: Preserve exact source and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-comparison-refusal-pytest
          path: .offline-refusal-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
