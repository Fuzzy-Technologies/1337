name: Genuine Nuclei acceptance

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nuclei-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-loopback:
    name: Nuclei 3.4.10 / owned loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.33
      - name: Synchronize locked environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Install checksum-pinned genuine Nuclei
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile

          asset_url = (
              "https://github.com/projectdiscovery/nuclei/releases/download/"
              "v3.4.10/nuclei_3.4.10_linux_amd64.zip"
          )
          expected_sha256 = "234c12cc5288af071abdcd6f854245b6067345556e1235cf96b76725c1004357"
          maximum_bytes = 128 * 1024 * 1024
          root = Path(os.environ["RUNNER_TEMP"]) / "nuclei-3.4.10"
          root.mkdir(mode=0o700)
          archive_path = root / "release.zip"
          digest = hashlib.sha256()
          received = 0

          with urlopen(asset_url, timeout=30) as response, archive_path.open("xb") as output:
              while chunk := response.read(1024 * 1024):
                  received += len(chunk)

                  if received > maximum_bytes:
                      raise ValueError("Nuclei release exceeds the finite download budget")

                  digest.update(chunk)
                  output.write(chunk)

          if digest.hexdigest() != expected_sha256:
              raise ValueError("Nuclei release checksum differs from the pinned upstream asset")

          with ZipFile(archive_path) as archive:
              members = archive.infolist()
              selected = [member for member in members if member.filename == "nuclei"]

              if len(members) > 32 or len(selected) != 1:
                  raise ValueError("Nuclei release has an unexpected finite member inventory")

              member = selected[0]
              mode = stat.S_IFMT(member.external_attr >> 16)

              if (member.is_dir() or member.flag_bits & 1
                  or mode not in {0, stat.S_IFREG}
                  or not 1 <= member.file_size <= maximum_bytes):
                  raise ValueError("Nuclei executable is not a bounded regular unencrypted member")

              executable = root / "nuclei"
              written = 0

              with archive.open(member) as source, executable.open("xb") as output:
                  while chunk := source.read(1024 * 1024):
                      written += len(chunk)

                      if written > member.file_size:
                          raise ValueError("Nuclei executable exceeds its verified member size")

                      output.write(chunk)

              if written != member.file_size:
                  raise ValueError("Nuclei executable differs from its verified member size")

          executable.chmod(0o700)
          PY
      - name: Execute genuine provider against pytest-owned loopback only
        env:
          FUZZY1337_NUCLEI_BINARY: ${{ runner.temp }}/nuclei-3.4.10/nuclei
        run: >-
          uv run --locked --extra dev pytest tests/integration/test_nuclei_native.py
          tests/functional/test_nuclei_web_checks.py
          -o addopts='' -q
      - name: Preserve actual native provider evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genuine-nuclei-3.4.10-owned-loopback
          path: |
            functional-evidence/nuclei-native/
            functional-evidence/nuclei-web-checks/
          if-no-files-found: warn
          retention-days: 14
