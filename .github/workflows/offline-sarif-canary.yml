name: Offline report read stability canary

on:
  push:
    branches: [fix/118-offline-sarif-canary]

permissions:
  contents: read

jobs:
  offline-sarif-integrity:
    if: >-
      github.event_name == 'push'
      && github.repository == 'Fuzzy-Technologies/1337'
      && github.ref == 'refs/heads/fix/118-offline-sarif-canary'
      && github.event.deleted == false
    name: Offline report read stability
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CANARY_SOURCE_SHA: f22dc70461361239d80f790a690e3a049fc3d660
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANARY_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify and record checked-out source
        id: source
        shell: bash
        run: |
          actual_sha="$(git rev-parse --verify HEAD)"
          test "$actual_sha" = "$CANARY_SOURCE_SHA"
          evidence_dir="$(cygpath -m "$RUNNER_TEMP")/offline-sarif-canary"
          mkdir -p "$evidence_dir"
          printf '%s\n' "$actual_sha" | tee "$evidence_dir/source-commit.txt"
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned uv
        shell: bash
        run: python -m pip install --no-deps uv==0.11.33
      - name: Synchronize locked dependencies
        shell: bash
        run: uv sync --locked --extra dev --python "$(python -c 'import sys; sys.stdout.write(sys.executable)')" --no-install-project
      - name: Run the offline report read stability test
        shell: bash
        timeout-minutes: 5
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          report="$(cygpath -m "$RUNNER_TEMP")/offline-sarif-canary/report-read-stability.xml"
          .venv/Scripts/python.exe -m pytest -q -x -n 0 --timeout=15 --timeout-method=thread \
            -o addopts='' --strict-config --strict-markers --no-cov \
            tests/contract/test_functional_report_comparison.py::test_ReadReportRefusesSameSizeInPlaceUpdate \
            --junitxml="$report"
          test -s "$report"
      - name: Preserve JUnit and source evidence
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-report-read-stability-windows
          path: |
            ${{ runner.temp }}/offline-sarif-canary/report-read-stability.xml
            ${{ runner.temp }}/offline-sarif-canary/source-commit.txt
          if-no-files-found: error
          retention-days: 14
