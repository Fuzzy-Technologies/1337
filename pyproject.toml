[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "1337"
version = "0.1.3"
description = "1337 Security Workbench open-source core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
1337 = "fuzzy1337.cli:main"
1337-dev = "fuzzy1337.dev_commands:main"

[project.optional-dependencies]
dev = [
    "build==1.6.0",
    "coverage==7.16.0",
    "hatchling==1.32.0",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzy1337"]
dev-mode-dirs = ["src"]

[tool.uv]
build-constraint-dependencies = [
    "editables==0.5", "hatchling==1.32.0", "packaging==26.3",
    "pathspec==1.1.1", "pluggy==1.6.0", "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/contracts", "/docs", "/pyproject.toml", "/uv.lock",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/AGENTS.md",
    "/DEVELOPMENT_PROTOCOL.md", "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=fuzzy1337 --cov-branch --cov-report=term-missing --cov-report=json:coverage/coverage.json --junitxml=coverage/tests.xml"
markers = ["integration: real package build and installation boundaries"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.coverage.run]
branch = true
source = ["fuzzy1337"]
relative_files = true

[tool.coverage.report]
# The stricter per-module gate is run by `1337-dev test` and `1337-dev check`.
fail_under = 80
exclude_lines = []
partial_branches = []
