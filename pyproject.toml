[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1337"
version = "0.1.0"
description = "1337 Security Workbench open-source core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
