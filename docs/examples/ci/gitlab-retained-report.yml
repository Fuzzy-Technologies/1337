# Include this file at a reviewed immutable revision, then explicitly extend the
# hidden job. Requires an installed approved 1337 wheel and Python >=3.13.
# The caller supplies a complete saved workspace through its own artifact policy.
.1337-retained-report:
  stage: test
  inherit:
    default: false
  timeout: 5m
  script:
    - |
      python3 -I - <<'PY'
      """Publish existing offline CLI projections as one GitLab artifact bundle."""

      import os
      import re
      import sys
      import tempfile
      from pathlib import Path

      try:
          project = Path(os.environ["CI_PROJECT_DIR"]).resolve(strict=True)
          namespace = os.environ["CI_JOB_ID"]

          if not re.fullmatch(r"[1-9][0-9]{0,19}", namespace) or Path.cwd().resolve() != project:
              raise ValueError("Run from CI_PROJECT_DIR with the actual numeric CI_JOB_ID.")

          # Retire before importing the package: even a missing wheel must not
          # expose an older JUnit file to GitLab's unconditional report collector.
          bundle = project / f"1337-retained-report-{namespace}"

          if bundle.exists() or bundle.is_symlink():
              retired = Path(tempfile.mkdtemp(prefix=".1337-retired-", dir=project))
              bundle.rename(retired / "bundle")

          from fuzzy1337.retained_report_ci import Main

          raise SystemExit(Main(project, namespace, os.environ.get("F1337_SAVED_WORKSPACE", "")))

      except (ImportError, KeyError, OSError, ValueError) as error:
          print(f"Retained report bootstrap refused: {error}", file=sys.stderr)
          raise SystemExit(4) from error
      PY
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - '1337-retained-report-$CI_JOB_ID/'
    reports:
      junit: '1337-retained-report-$CI_JOB_ID/report.junit.xml'
