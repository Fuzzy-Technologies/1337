site_name: 1337 Security Workbench API Reference
site_description: Static Community Python API reference.
repo_url: https://github.com/Fuzzy-Technologies/1337
repo_name: Fuzzy-Technologies/1337
edit_uri: edit/develop/docs/site/content/en/
strict: true
use_directory_urls: true
theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
extra:
  alternate:
    - name: English
      link: https://fuzzy-technologies.github.io/1337/api/latest/en/
      lang: en
    - name: Русский
      link: https://fuzzy-technologies.github.io/1337/api/latest/ru/
      lang: ru
    - name: 简体中文
      link: https://fuzzy-technologies.github.io/1337/api/latest/zh-cn/
      lang: zh
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            allow_inspection: false
            force_inspection: false
            docstring_style: google
            members_order: source
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            signature_crossrefs: false
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
extra_javascript:
  - assets/mathjax/tex-mml-svg.js
