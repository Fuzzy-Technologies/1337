<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="keywords" content="1337 Security Workbench, cybersecurity, security workstation, AI security, cyber agent runtime, security agent harness, pentesting, security automation, attack graph, attack path, reachability analysis, evidence-first security, Fuzzy Technologies" />
    <meta name="theme-color" content="#0d0d0d" />

    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="1337 Security Workbench" />
    {% if page.lang == 'ru' %}
    <meta property="og:locale" content="ru_RU" />
    {% elsif page.lang == 'zh-CN' %}
    <meta property="og:locale" content="zh_CN" />
    {% else %}
    <meta property="og:locale" content="en_US" />
    {% endif %}
    <meta name="twitter:card" content="summary" />

    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}" />
    <link rel="alternate" hreflang="ru" href="{{ '/ru/' | absolute_url }}" />
    <link rel="alternate" hreflang="zh-CN" href="{{ '/zh-cn/' | absolute_url }}" />
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}" />
    <link rel="stylesheet" href="{{ '/static/style.css' | relative_url }}" />
    <title>{{ page.title | default: site.title }}</title>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
