id: owned-http-marker
info:
  name: Owned synthetic HTTP marker
  author: fuzzy-technologies
  severity: info
  tags: synthetic
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    matchers:
      - type: word
        part: body
        words:
          - "1337-owned-synthetic-marker"
