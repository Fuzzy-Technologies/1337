name: fuzzy-1337

x-workbench: &workbench
  build:
    context: .
    target: development
  image: fuzzy-technologies/1337-dev:local
  init: true
  user: "${LOCAL_UID:-1337}:${LOCAL_GID:-1337}"
  working_dir: /workspace
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    UV_PROJECT_ENVIRONMENT: /opt/1337/.venv
  volumes:
    - .:/workspace:rw

x-attack-path-target: &attack-path-target
  profiles: ["attack-path"]
  build:
    context: ./labs/targets/attack-path-mini
  image: fuzzy-technologies/1337-attack-path-mini:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - synthetic-lab

services:
  workbench:
    <<: *workbench
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--extra", "dev", "1337", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  quality:
    <<: *workbench
    profiles: ["quality"]
    command: ["1337-dev", "check"]

  lab-web-safe:
    profiles: ["lab"]
    build:
      context: ./labs/targets/web-safe
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - synthetic-lab

  lab-web-micro:
    profiles: ["lab"]
    build:
      context: ./labs/targets/web-micro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - synthetic-lab

  lab-attack-portal:
    <<: *attack-path-target
    command: ["python", "portal.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 2s

  lab-attack-identity:
    <<: *attack-path-target
    command: ["python", "identity.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 2s

  lab-attack-events:
    <<: *attack-path-target
    command: ["python", "events.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 2s

  lab-attack-billing:
    <<: *attack-path-target
    command: ["python", "billing.py"]
    depends_on:
      lab-attack-events:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 2s

  lab-attack-client:
    <<: *attack-path-target
    command: ["python", "client.py", "serve"]
    depends_on:
      lab-attack-portal:
        condition: service_healthy
      lab-attack-identity:
        condition: service_healthy
      lab-attack-billing:
        condition: service_healthy
      lab-attack-events:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 2s

networks:
  synthetic-lab:
    internal: true
